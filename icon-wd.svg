<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Web Development Icon - Monitor with code -->
  <circle cx="50" cy="50" r="45" fill="#f0f0f0" stroke="#007bff" stroke-width="2"/>
  
  <!-- Monitor -->
  <rect x="22" y="28" width="56" height="38" fill="none" stroke="#007bff" stroke-width="2" rx="2"/>
  
  <!-- Monitor stand -->
  <rect x="40" y="66" width="20" height="6" fill="#007bff" rx="1"/>
  <rect x="35" y="72" width="30" height="3" fill="#007bff" rx="1"/>
  
  <!-- Screen content - code brackets -->
  <text x="30" y="45" font-family="monospace" font-size="14" fill="#007bff" font-weight="bold">&lt;</text>
  <text x="50" y="45" font-family="monospace" font-size="12" fill="#ff6b6b" font-weight="bold">html</text>
  <text x="30" y="58" font-family="monospace" font-size="14" fill="#007bff" font-weight="bold">/</text>
  <text x="40" y="58" font-family="monospace" font-size="14" fill="#007bff" font-weight="bold">&gt;</text>
</svg>