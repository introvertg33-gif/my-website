<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Video Editing Icon - Film reel with play button -->
  <circle cx="50" cy="50" r="45" fill="#f0f0f0" stroke="#007bff" stroke-width="2"/>
  
  <!-- Film reel -->
  <circle cx="50" cy="50" r="28" fill="none" stroke="#007bff" stroke-width="2"/>
  
  <!-- Reel spokes -->
  <line x1="50" y1="22" x2="50" y2="78" stroke="#007bff" stroke-width="1.5"/>
  <line x1="22" y1="50" x2="78" y2="50" stroke="#007bff" stroke-width="1.5"/>
  <line x1="32" y1="32" x2="68" y2="68" stroke="#007bff" stroke-width="1.5"/>
  <line x1="68" y1="32" x2="32" y2="68" stroke="#007bff" stroke-width="1.5"/>
  
  <!-- Film strips on sides -->
  <rect x="18" y="35" width="4" height="30" fill="#007bff" rx="1"/>
  <rect x="78" y="35" width="4" height="30" fill="#007bff" rx="1"/>
  
  <!-- Play button (triangle) in center -->
  <polygon points="48,42 48,58 60,50" fill="#007bff"/>
</svg>